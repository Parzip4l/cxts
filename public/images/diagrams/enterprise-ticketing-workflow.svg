<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Ticketing Workflow</title>
  <desc id="desc">Portrait enterprise workflow diagram for ticket creation, approval, assignment, execution, pause and resume cycle, closure, and SLA logging.</desc>
  <defs>
    <linearGradient id="pageBg" x1="120" y1="40" x2="920" y2="1920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 180) rotate(90) scale(220 320)">
      <stop stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#DBEAFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 1640) rotate(90) scale(280 340)">
      <stop stop-color="#FFEDD5"/>
      <stop offset="1" stop-color="#FFEDD5" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <filter id="legendShadow" x="-20%" y="-20%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1.5L9 6L1 10.5V1.5Z" fill="#94A3B8"/>
    </marker>
    <style>
      .font {
        font-family: Inter, Roboto, "Segoe UI", Arial, sans-serif;
        fill: #0F172A;
      }
      .title {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .subtitle {
        font-size: 15px;
        font-weight: 500;
        fill: #64748B;
      }
      .legend {
        font-size: 13px;
        font-weight: 600;
        fill: #475569;
      }
      .node {
        font-size: 18px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .node-sm {
        font-size: 16px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .decision-txt {
        font-size: 15px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .tag-text {
        font-size: 13px;
        font-weight: 700;
        fill: #64748B;
        letter-spacing: 0.02em;
        text-anchor: middle;
      }
      .system {
        fill: #EFF6FF;
        stroke: #BFDBFE;
        stroke-width: 2;
      }
      .user {
        fill: #FFF7ED;
        stroke: #FDBA74;
        stroke-width: 2;
      }
      .success {
        fill: #ECFDF3;
        stroke: #86EFAC;
        stroke-width: 2;
      }
      .danger {
        fill: #FEF2F2;
        stroke: #FCA5A5;
        stroke-width: 2;
      }
      .neutral {
        fill: #F8FAFC;
        stroke: #CBD5E1;
        stroke-width: 2;
      }
      .decision {
        fill: #FFFFFF;
        stroke: #CBD5E1;
        stroke-width: 2.2;
      }
      .tag {
        fill: #FFFFFF;
        stroke: #CBD5E1;
        stroke-width: 1.2;
      }
      .connector {
        stroke: #94A3B8;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        marker-end: url(#arrow);
      }
      .helper {
        font-size: 13px;
        font-weight: 600;
        fill: #64748B;
      }
    </style>
  </defs>

  <rect width="1080" height="1920" fill="#FFFFFF"/>
  <rect width="1080" height="1920" fill="url(#pageBg)"/>
  <ellipse cx="820" cy="180" rx="320" ry="220" fill="url(#topGlow)"/>
  <ellipse cx="240" cy="1640" rx="340" ry="280" fill="url(#bottomGlow)"/>

  <g class="font">
    <text x="96" y="92" class="title">Enterprise Ticketing Workflow</text>
    <text x="96" y="122" class="subtitle">Portrait enterprise flow for intake, approval, assignment, execution, pause cycle, and closure</text>
  </g>

  <g class="font" transform="translate(96 152)" filter="url(#legendShadow)">
    <rect x="0" y="0" width="888" height="88" rx="26" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="38" cy="31" r="8" fill="#60A5FA"/>
    <text x="56" y="36" class="legend">Blue: system process</text>
    <circle cx="290" cy="31" r="8" fill="#FB923C"/>
    <text x="308" y="36" class="legend">Orange: user action</text>
    <circle cx="525" cy="31" r="8" fill="#4ADE80"/>
    <text x="543" y="36" class="legend">Green: success / completed</text>
    <circle cx="38" cy="58" r="8" fill="#F87171"/>
    <text x="56" y="63" class="legend">Red: rejected / failed</text>
    <circle cx="290" cy="58" r="8" fill="#94A3B8"/>
    <text x="308" y="63" class="legend">Gray: neutral states</text>
  </g>

  <g filter="url(#cardShadow)" class="font">
    <rect x="480" y="284" width="120" height="32" rx="16" class="neutral"/>
    <text x="540" y="300" class="node-sm">Start</text>

    <rect x="240" y="346" width="600" height="64" rx="24" class="user"/>
    <text x="540" y="378" class="node">User Creates Ticket (Internal / Public)</text>

    <rect x="180" y="438" width="720" height="80" rx="28" class="system"/>
    <text x="540" y="478" class="node">
      <tspan x="540" dy="-12">System Auto Determine SLA, Priority,</tspan>
      <tspan x="540" dy="24">Approval Rule</tspan>
    </text>

    <polygon points="540,548 612,620 540,692 468,620" class="decision"/>
    <text x="540" y="620" class="decision-txt">
      <tspan x="540" dy="-10">Approval</tspan>
      <tspan x="540" dy="20">Required?</tspan>
    </text>

    <rect x="230" y="724" width="620" height="60" rx="24" class="neutral"/>
    <text x="540" y="754" class="node">Approval Process (Manager / Head Division)</text>

    <polygon points="540,818 612,890 540,962 468,890" class="decision"/>
    <text x="540" y="890" class="decision-txt">Approved?</text>

    <rect x="280" y="998" width="520" height="60" rx="24" class="neutral"/>
    <text x="540" y="1028" class="node">Ready for Assignment</text>

    <rect x="190" y="1090" width="700" height="60" rx="24" class="neutral"/>
    <text x="540" y="1120" class="node">Assign Engineer (Supervisor / Admin)</text>

    <rect x="270" y="1182" width="540" height="60" rx="24" class="user"/>
    <text x="540" y="1212" class="node">Engineer Start Work</text>

    <rect x="340" y="1274" width="400" height="60" rx="24" class="system"/>
    <text x="540" y="1304" class="node">In Progress</text>

    <polygon points="540,1368 612,1440 540,1512 468,1440" class="decision"/>
    <text x="540" y="1440" class="decision-txt">
      <tspan x="540" dy="-10">Pause</tspan>
      <tspan x="540" dy="20">Needed?</tspan>
    </text>

    <rect x="300" y="1548" width="480" height="60" rx="24" class="success"/>
    <text x="540" y="1578" class="node">Work Completed</text>

    <rect x="360" y="1640" width="360" height="60" rx="24" class="success"/>
    <text x="540" y="1670" class="node">Ticket Closed</text>

    <rect x="154" y="1732" width="772" height="88" rx="28" class="neutral"/>
    <text x="540" y="1776" class="node-sm">
      <tspan x="540" dy="-10">Log Activity &amp; Performance</tspan>
      <tspan x="540" dy="22">(SLA, Duration, History, Metrics)</tspan>
    </text>

    <rect x="480" y="1850" width="120" height="32" rx="16" class="success"/>
    <text x="540" y="1866" class="node-sm">End</text>

    <rect x="712" y="1418" width="228" height="52" rx="22" class="neutral"/>
    <text x="826" y="1444" class="node">Paused</text>

    <rect x="690" y="1498" width="272" height="52" rx="22" class="neutral"/>
    <text x="826" y="1524" class="node">Resume Work</text>

    <rect x="74" y="862" width="278" height="60" rx="24" class="danger"/>
    <text x="213" y="892" class="node-sm">
      <tspan x="213" dy="-10">Rejected / Revision</tspan>
      <tspan x="213" dy="20">/ Cancel</tspan>
    </text>

    <rect x="153" y="952" width="120" height="32" rx="16" class="neutral"/>
    <text x="213" y="968" class="node-sm">End</text>
  </g>

  <g class="font">
    <path class="connector" d="M540 316V346"/>
    <path class="connector" d="M540 410V438"/>
    <path class="connector" d="M540 518V548"/>
    <path class="connector" d="M540 692V724"/>
    <path class="connector" d="M540 784V818"/>
    <path class="connector" d="M540 962V998"/>
    <path class="connector" d="M540 1058V1090"/>
    <path class="connector" d="M540 1150V1182"/>
    <path class="connector" d="M540 1242V1274"/>
    <path class="connector" d="M540 1334V1368"/>
    <path class="connector" d="M540 1512V1548"/>
    <path class="connector" d="M540 1608V1640"/>
    <path class="connector" d="M540 1700V1732"/>
    <path class="connector" d="M540 1820V1850"/>

    <path class="connector" d="M612 620H826V1028H800"/>
    <path class="connector" d="M468 890H352"/>
    <path class="connector" d="M213 922V952"/>
    <path class="connector" d="M612 1440H712"/>
    <path class="connector" d="M826 1470V1498"/>
    <path class="connector" d="M690 1524H650V1304H740"/>
  </g>

  <g class="font">
    <rect x="628" y="604" width="44" height="24" rx="12" class="tag"/>
    <text x="650" y="620" class="tag-text">Yes</text>

    <rect x="760" y="1012" width="36" height="24" rx="12" class="tag"/>
    <text x="778" y="1028" class="tag-text">No</text>

    <rect x="628" y="874" width="44" height="24" rx="12" class="tag"/>
    <text x="650" y="890" class="tag-text">Yes</text>

    <rect x="388" y="874" width="36" height="24" rx="12" class="tag"/>
    <text x="406" y="890" class="tag-text">No</text>

    <rect x="632" y="1424" width="44" height="24" rx="12" class="tag"/>
    <text x="654" y="1440" class="tag-text">Yes</text>

    <rect x="558" y="1518" width="118" height="24" rx="12" class="tag"/>
    <text x="617" y="1534" class="tag-text">No / Continue</text>

    <text x="660" y="1372" class="helper">Back to "In Progress"</text>
  </g>
</svg>
